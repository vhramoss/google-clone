<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Images</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-right">
    <a href="index.html">Back</a>
  </div>

  <div class="center">
    <h1 class="logo">Google Images</h1>

    <form action="https://www.google.com/search" method="GET">
      <input type="hidden" name="tbm" value="isch">
      <input type="text" name="q" class="search-box" placeholder="Search in Google Images">
      <div class="buttons">
        <input type="submit" value="Search for Images">
      </div>
    </form>
  </div>
</body>
</html>
